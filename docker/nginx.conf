server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (locations below use `expires`, not add_header, so these are inherited)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Google Forms embed: docs.google.com, plus *.google.com because Google routes signed-in
    # visitors through accounts.google.com before showing the form.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-src https://www.youtube-nocookie.com https://docs.google.com https://*.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/(img|fonts)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Browsers revalidate on every visit (cheap 304 when unchanged) so updates show up immediately
    location ~* ^/(css|js)/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
